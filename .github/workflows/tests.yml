name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[async]'
      - name: Test the installed package outside the source checkout
        run: |
          cd /tmp
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
